["What shampoo is good for dry hair?","¿Qué champú es bueno para el cabello seco?","The Coconut Moisture Shampoo",["The Coconut Moisture Shampoo","The Tea Tree Cleanser","The Herbal Soap Bar"]],["Is the Gentle Face Cream big or small?","¿La crema facial es grande o pequeña?","Small (50ml)",["Small (50ml)","Big (500ml)"]],["Do the toothbrushes come with free toothpaste?","¿Los cepillos vienen con pasta dental gratis?","Yes, they do.",["Yes, they do.","No, they don’t."]],["What does the Tea Tree Cleanser do?","¿Qué hace el limpiador de árbol de té?","It removes dirt and oil.",["It removes dirt and oil.","It makes hair soft.","It protects from the sun."]]]},
